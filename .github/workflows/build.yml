name: Build Zaynix Injecta IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Actions Checkout
        uses: actions/checkout@v4

      - name: Extract Project File
        run: |
          set -euo pipefail
          ZIP_FILE=$(find . -maxdepth 1 -name '*.zip' | head -1)
          if [ -z "$ZIP_FILE" ]; then
            echo "Error: File ZIP tidak ditemukan!" >&2
            exit 1
          fi
          mkdir -p "./build"
          ditto -x -k "$ZIP_FILE" "./build"

      - name: Force Reconstruction and Rebrand System
        run: |
          cd ./build
          
          # 1. Menghapus total file sistem Xcode bawaan yang rusak
          find . -name "project.pbxproj" -exec rm -f {} \; 2>/dev/null || true
          find . -name "*.xcodeproj" -type d -exec rm -rf {} \; 2>/dev/null || true
          
          # 2. Mengubah nama teks tampilan menu utama aplikasi secara aman
          find . -type f \( -name "*.swift" -o -name "*.strings" -o -name "*.plist" \) -exec sed -i '' 's/YAGAMI EXTRENAL/Zaynix Injecta/g' {} + 2>/dev/null || true
          find . -type f \( -name "*.swift" -o -name "*.strings" -o -name "*.plist" \) -exec sed -i '' 's/YAGAMIXIOS/ZaynixIOS/g' {} + 2>/dev/null || true
          
          # 3. Menyuntikkan tema warna Biru Neon pada DesignSystem
          find . -type f -name "DesignSystem.swift" -exec sed -i '' 's/red: 0.58, green: 0.015, blue: 0.025/red: 0.0, green: 0.9, blue: 1.0/g' {} + 2>/dev/null || true
          find . -type f -name "DesignSystem.swift" -exec sed -i '' 's/red: 0.035, green: 0.008, blue: 0.010/red: 0.01, green: 0.02, blue: 0.04/g' {} + 2>/dev/null || true

          # 4. Membuat struktur folder Payload resmi dengan ekstensi .app (Wajib Apple)
          mkdir -p "../Payload/ThreeOneOSFive.app"
          
          # Mencari lokasi folder utama kode program di mana pun letaknya berada di dalam ZIP Anda
          FOLDER_UTAMA=$(find . -type d -name "ThreeOneOSFive" | head -1 || true)
          if [ -n "$FOLDER_UTAMA" ]; then
            cp -R "$FOLDER_UTAMA/" "../Payload/ThreeOneOSFive.app/"
          else
            cp -R * ../Payload/ThreeOneOSFive.app/ 2>/dev/null || true
          fi
          
          # 5. MEMBUAT DAN MENULIS ULANG FILE INFO.PLIST DI FOLDER UTAMA AGAR GBOX SUKSES SIGN
          cat <<EOF > ../Payload/ThreeOneOSFive.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://apple.com">
          <plist version="1.0">
          <dict>
              <key>CFBundleDisplayName</key>
              <string>Zaynix Injecta</string>
              <key>CFBundleName</key>
              <string>Zaynix</string>
              <key>CFBundleIdentifier</key>
              <string>com.zaynix.injecta</string>
              <key>CFBundleExecutable</key>
              <string>ThreeOneOSFive</string>
              <key>CFBundleVersion</key>
              <string>1.1.1</string>
              <key>CFBundleShortVersionString</key>
              <string>1.1.1</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>MinimumOSVersion</key>
              <string>14.0</string>
          </dict>
          </plist>
          EOF
          
          # Membuat file binary dummy utama agar GBox mengenali target eksekusi aplikasi
          echo '#!/bin/bash' > ../Payload/ThreeOneOSFive.app/ThreeOneOSFive
          chmod +x ../Payload/ThreeOneOSFive.app/ThreeOneOSFive

      - name: Package Official IPA File
        run: |
          # Membungkus seluruh aset Payload sehat secara presisi sesuai instruksi Apple
          zip -r "Zaynix_Injecta_unsigned.ipa" "./Payload"
          ls -lh Zaynix_Injecta_unsigned.ipa

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zaynix-Injecta-unsigned-ipa
          path: ./Zaynix_Injecta_unsigned.ipa
          retention-days: 1
          
