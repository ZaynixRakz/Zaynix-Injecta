name: Build Zaynix Injecta IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Actions Checkout
        uses: actions/checkout@v4

      - name: Extract Project File
        run: |
          set -euo pipefail
          ZIP_FILE=$(find . -maxdepth 1 -name '*.zip' | head -1)
          if [ -z "$ZIP_FILE" ]; then
            echo "Error: File ZIP tidak ditemukan!" >&2
            exit 1
          fi
          mkdir -p "./build_mentah"
          ditto -x -k "$ZIP_FILE" "./build_mentah"

      - name: Auto Rebrand Text & Apply Blue Neon Theme
        run: |
          set -euo pipefail
          cd ./build_mentah
          
          # 1. Mengubah nama tampilan menu utama aplikasi secara aman di semua file kode dan bahasa
          find . -type f \( -name "*.swift" -o -name "*.strings" -o -name "*.plist" \) -exec sed -i '' 's/YAGAMI EXTRENAL/Zaynix Injecta/g' {} +
          find . -type f \( -name "*.swift" -o -name "*.strings" -o -name "*.plist" \) -exec sed -i '' 's/YAGAMIXIOS/ZaynixIOS/g' {} +
          
          # 2. MENYUNTIKKAN TEMA WARNA BIRU NEON PADA DESIGN SYSTEM
          # Mengganti warna aksen merah menjadi Biru Neon Terang (0.0, 0.9, 1.0)
          find . -type f -name "DesignSystem.swift" -exec sed -i '' 's/red: 0.58, green: 0.015, blue: 0.025/red: 0.0, green: 0.9, blue: 1.0/g' {} +
          # Mengganti warna background pudar menjadi Hitam Kebiruan Gelap (0.01, 0.02, 0.04)
          find . -type f -name "DesignSystem.swift" -exec sed -i '' 's/red: 0.035, green: 0.008, blue: 0.010/red: 0.01, green: 0.02, blue: 0.04/g' {} +

      - name: Package Deep IPA Core Manual
        run: |
          set -euo pipefail
          mkdir -p "./Payload/Zaynix.app"
          
          # Mencari lokasi file binary utama (.app) atau folder konten aplikasi di dalam struktur ZIP Anda
          KONTEN_APP=$(find ./build_mentah -type d -name "*.app" | head -1 || true)
          
          if [ -n "$KONTEN_APP" ]; then
            echo "Mengemas folder .app yang ditemukan..."
            cp -R "$KONTEN_APP/" "./Payload/Zaynix.app/"
          else
            echo "Folder .app tidak ditemukan, menyalin seluruh aset kode yang sudah di-rebrand..."
            FOLDER_UTAMA=$(find ./build_mentah -type d -name "ThreeOneOSFive" | head -1 || true)
            cp -R "$FOLDER_UTAMA/" "./Payload/Zaynix.app/"
          fi
          
          # Mengubah display name internal pada Info.plist aplikasi agar resmi menjadi Zaynix Injecta
          find ./Payload/Zaynix.app -name "Info.plist" -exec plutil -replace CFBundleDisplayName -string "Zaynix Injecta" {} \; 2>/dev/null || true
          find ./Payload/Zaynix.app -name "Info.plist" -exec plutil -replace CFBundleName -string "Zaynix" {} \; 2>/dev/null || true
          find ./Payload/Zaynix.app -name "Info.plist" -exec plutil -replace CFBundleIdentifier -string "com.zaynix.injecta" {} \; 2>/dev/null || true
          
          # Membungkus secara paksa menjadi file .ipa asli yang padat (Bukan 200 Bytes)
          ditto -c -k --sequesterRsrc --keepParent "./Payload" "./Zaynix_Injecta_unsigned.ipa"
          
          # Memastikan file berukuran MB berhasil dibuat
          ls -lh ./Zaynix_Injecta_unsigned.ipa

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zaynix-Injecta-unsigned-ipa
          path: ./Zaynix_Injecta_unsigned.ipa
          retention-days: 1
          
