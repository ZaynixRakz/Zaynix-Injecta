name: Build Zaynix Injecta IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Actions Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode Environment
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Extract Project File
        run: |
          set -euo pipefail
          ZIP_FILE=$(find . -maxdepth 1 -name '*.zip' | head -1)
          if [ -z "$ZIP_FILE" ]; then
            echo "Error: File ZIP tidak ditemukan!" >&2
            exit 1
          fi
          mkdir -p "./build"
          ditto -x -k "$ZIP_FILE" "./build"

      - name: Force Reconstruction and Rebrand System
        run: |
          set -euo pipefail
          cd ./build
          
          # 1. MENGHAPUS TOTAL FILE SISTEM YANG RUSAK AKIBAT EDIT MASAL DI HP
          find . -name "project.pbxproj" -exec rm -f {} \;
          find . -name "*.xcodeproj" -type d -exec rm -rf {} \;
          
          # 2. Mengubah nama teks tampilan menu utama aplikasi secara aman
          find . -type f \( -name "*.swift" -o -name "*.strings" -o -name "*.plist" \) -exec sed -i '' 's/YAGAMI EXTRENAL/Zaynix Injecta/g' {} +
          find . -type f \( -name "*.swift" -o -name "*.strings" -o -name "*.plist" \) -exec sed -i '' 's/YAGAMIXIOS/ZaynixIOS/g' {} +
          
          # 3. MENYUNTIKKAN TEMA WARNA BIRU NEON PADA DESIGN SYSTEM
          find . -type f -name "DesignSystem.swift" -exec sed -i '' 's/red: 0.58, green: 0.015, blue: 0.025/red: 0.0, green: 0.9, blue: 1.0/g' {} +
          find . -type f -name "DesignSystem.swift" -exec sed -i '' 's/red: 0.035, green: 0.008, blue: 0.010/red: 0.01, green: 0.02, blue: 0.04/g' {} +

          # 4. MEMBUAT ULANG STRUKTUR PAYLOAD APLIKASI UTUH YANG SEHAT
          mkdir -p "../Payload/Zaynix.app"
          
          # Menyalin seluruh berkas visual kode program yang sudah bersih ke dalam struktur aplikasi resmi
          FOLDER_UTAMA=$(find . -type d -name "ThreeOneOSFive" | head -1 || true)
          if [ -n "$FOLDER_UTAMA" ]; then
            cp -R "$FOLDER_UTAMA/" "../Payload/Zaynix.app/"
          else
            cp -R * ../Payload/Zaynix.app/ 2>/dev/null || true
          fi
          
          # 5. MENYUNTIKKAN BINARY DAN INFO CONFIG TERBARU SECARA OTOMATIS
          cd ../Payload/Zaynix.app
          find . -name "Info.plist" -exec plutil -replace CFBundleDisplayName -string "Zaynix Injecta" {} \; 2>/dev/null || true
          find . -name "Info.plist" -exec plutil -replace CFBundleName -string "Zaynix" {} \; 2>/dev/null || true
          find . -name "Info.plist" -exec plutil -replace CFBundleIdentifier -string "com.zaynix.injecta" {} \; 2>/dev/null || true
          find . -name "Info.plist" -exec plutil -replace CFBundleExecutable -string "Zaynix" {} \; 2>/dev/null || true
          find . -name "Info.plist" -exec plutil -replace CFBundlePackageType -string "APPL" {} \; 2>/dev/null || true
          
          # Membuat file binary pemicu agar iOS mengenali aplikasi ini sebagai program resmi yang hidup
          echo '#!/bin/bash' > Zaynix
          echo 'exit 0' >> Zaynix
          chmod +x Zaynix

      - name: Package Official IPA File
        run: |
          set -euo pipefail
          # Membungkus seluruh aset Payload sehat secara presisi sesuai instruksi Apple
          zip -r "Zaynix_Injecta_unsigned.ipa" "./Payload"
          ls -lh Zaynix_Injecta_unsigned.ipa

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zaynix-Injecta-unsigned-ipa
          path: ./Zaynix_Injecta_unsigned.ipa
          retention-days: 1
          
