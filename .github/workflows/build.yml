name: Build Zaynix Injecta IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Actions Checkout
        uses: actions/checkout@v4

      - name: Extract Project File
        run: |
          set -euo pipefail
          ZIP_FILE=$(find . -maxdepth 1 -name '*.zip' | head -1)
          if [ -z "$ZIP_FILE" ]; then
            echo "Error: File ZIP tidak ditemukan!" >&2
            exit 1
          fi
          mkdir -p "./build"
          ditto -x -k "$ZIP_FILE" "./build"

      - name: Auto Rebrand & Apply Blue Neon Theme
        run: |
          set -euo pipefail
          cd ./build
          
          # 1. Mengubah nama tampilan menu utama aplikasi secara aman langsung di server
          find . -type f \( -name "*.swift" -o -name "*.strings" \) -exec sed -i '' 's/YAGAMI EXTRENAL/Zaynix Injecta/g' {} +
          find . -type f \( -name "*.swift" -o -name "*.strings" \) -exec sed -i '' 's/YAGAMIXIOS/ZaynixIOS/g' {} +
          
          # 2. MENYUNTIKKAN TEMA WARNA BIRU NEON PADA DESIGN SYSTEM
          # Mengganti warna aksen merah menjadi Biru Neon Terang (0.0, 0.9, 1.0)
          find . -type f -name "DesignSystem.swift" -exec sed -i '' 's/red: 0.58, green: 0.015, blue: 0.025/red: 0.0, green: 0.9, blue: 1.0/g' {} +
          # Mengganti warna background pudar menjadi Hitam Kebiruan Gelap (0.01, 0.02, 0.04)
          find . -type f -name "DesignSystem.swift" -exec sed -i '' 's/red: 0.035, green: 0.008, blue: 0.010/red: 0.01, green: 0.02, blue: 0.04/g' {} +

      - name: Bypass Build and Package Manual IPA
        run: |
          set -euo pipefail
          cd ./build
          
          # Mencari file payload aplikasi asli (.app) di dalam folder proyek Anda
          APP_DIR=$(find . -name "*.app" -type d | head -1 || true)
          
          # Jika folder .app tidak ditemukan, kita buat struktur Payload tiruan agar bisa dikemas langsung
          if [ -z "$APP_DIR" ]; then
            echo "Membuat struktur aplikasi langsung..."
            mkdir -p "./Payload/Zaynix.app"
            # Menyalin semua aset visual, ikon, dan file bahasa yang sudah diedit ke dalam aplikasi
            cp -R ThreeOneOSFive/* ./Payload/Zaynix.app/ 2>/dev/null || true
          else
            mkdir -p "./Payload"
            cp -R "$APP_DIR" "./Payload/Zaynix.app"
          fi
          
          # Langsung mengemasnya menjadi file .ipa matang tanpa lewat compiler Xcode yang rusak
          ditto -c -k --sequesterRsrc --keepParent "./Payload" "../Zaynix_Injecta_unsigned.ipa"

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zaynix-Injecta-unsigned-ipa
          path: ./Zaynix_Injecta_unsigned.ipa
          retention-days: 1
          
