name: Build Unsigned IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Extract Project File
        run: |
          set -euo pipefail
          ZIP_FILE=$(find . -maxdepth 1 -name '*.zip' | head -1)
          if [ -z "$ZIP_FILE" ]; then
            echo "Error: File ZIP tidak ditemukan!" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/project"
          ditto -x -k "$ZIP_FILE" "$RUNNER_TEMP/project"

      - name: Locate Xcode Project
        id: locate
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/project"
          PROJECT=$(find "$ROOT" -name '*.xcodeproj' -type d | head -1 || true)
          WORKSPACE=$(find "$ROOT" -name '*.xcworkspace' -type d | grep -v '/Pods/' | head -1 || true)
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"

      - name: Build Unsigned Archive
        env:
          PROJECT: ${{ steps.locate.outputs.project }}
          WORKSPACE: ${{ steps.locate.outputs.workspace }}
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/App.xcarchive"
          if [ -n "$WORKSPACE" ]; then
            xcodebuild archive -workspace "$WORKSPACE" -scheme "ZAYNX" -sdk iphoneos -configuration Release -archivePath "$ARCHIVE" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' PRODUCT_BUNDLE_IDENTIFIER="com.zaynix.injecta"
          else
            xcodebuild archive -project "$PROJECT" -scheme "ZAYNX" -sdk iphoneos -configuration Release -archivePath "$ARCHIVE" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' PRODUCT_BUNDLE_IDENTIFIER="com.zaynix.injecta"
          fi

      - name: Package IPA
        run: |
          set -euo pipefail
          APP_PATH=$(find "$RUNNER_TEMP/App.xcarchive/Products/Applications" -maxdepth 1 -name '*.app' -type d | head -1)
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/"
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/Payload" "$RUNNER_TEMP/Zaynix.ipa"

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zaynix-Unsigned-IPA
          path: ${{ runner.temp }}/Zaynix.ipa
          retention-days: 1
          
