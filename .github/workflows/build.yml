name: Build Zaynix Injecta IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Actions Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode Environment
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Extract Project File
        run: |
          set -euo pipefail
          ZIP_FILE=$(find . -maxdepth 1 -name '*.zip' | head -1)
          if [ -z "$ZIP_FILE" ]; then
            echo "Error: File ZIP tidak ditemukan!" >&2
            exit 1
          fi
          mkdir -p "./build"
          ditto -x -k "$ZIP_FILE" "./build"

      - name: Auto Clean and Rebrand Name
        run: |
          set -euo pipefail
          cd ./build
          
          # Mengubah sistem internal secara aman langsung di komputer virtual Mac
          find . -type f \( -name "*.pbxproj" -o -name "*.xcscheme" -o -name "*.swift" -o -name "*.strings" \) -exec sed -i '' 's/OGIOS/ZAYNX/g' {} +
          find . -type f \( -name "*.pbxproj" -o -name "*.xcscheme" -o -name "*.swift" -o -name "*.strings" \) -exec sed -i '' 's/YAGAMI EXTRENAL/Zaynix Injecta/g' {} +

      - name: Build Unsigned Application
        run: |
          set -euo pipefail
          cd ./build
          
          PROJECT=$(find . -name '*.xcodeproj' -type d | head -1 || true)
          WORKSPACE=$(find . -name '*.xcworkspace' -type d | grep -v '/Pods/' | head -1 || true)
          
          if [ -n "$WORKSPACE" ]; then
            SCHEME=$(xcodebuild -list -json -workspace "$WORKSPACE" | /usr/bin/python3 -c 'import json,sys; d=json.load(sys.stdin); print((d.get("workspace",{}).get("schemes") or ["ZAYNX"])[0])')
            xcodebuild archive -workspace "$WORKSPACE" -scheme "$SCHEME" -sdk iphoneos -configuration Release -archivePath "./App.xcarchive" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' PRODUCT_BUNDLE_IDENTIFIER="com.zaynix.injecta"
          else
            SCHEME=$(xcodebuild -list -json -project "$PROJECT" | /usr/bin/python3 -c 'import json,sys; d=json.load(sys.stdin); print((d.get("project",{}).get("schemes") or ["ZAYNX"])[0])')
            xcodebuild archive -project "$PROJECT" -scheme "$SCHEME" -sdk iphoneos -configuration Release -archivePath "./App.xcarchive" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' PRODUCT_BUNDLE_IDENTIFIER="com.zaynix.injecta"
          fi

      - name: Package IPA File
        run: |
          set -euo pipefail
          cd ./build
          APP_PATH=$(find "./App.xcarchive/Products/Applications" -maxdepth 1 -name '*.app' -type d | head -1)
          mkdir -p "./Payload"
          cp -R "$APP_PATH" "./Payload/"
          ditto -c -k --sequesterRsrc --keepParent "./Payload" "../Zaynix_Injecta_unsigned.ipa"

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zaynix-Injecta-unsigned-ipa
          path: ./Zaynix_Injecta_unsigned.ipa
          retention-days: 1
          
