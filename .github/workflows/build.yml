name: Build Zaynix Injecta IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Actions Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode Environment
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Extract Project File
        run: |
          set -euo pipefail
          ZIP_FILE=$(find . -maxdepth 1 -name '*.zip' | head -1)
          if [ -z "$ZIP_FILE" ]; then
            echo "Error: File ZIP tidak ditemukan!" >&2
            exit 1
          fi
          mkdir -p "./build"
          ditto -x -k "$ZIP_FILE" "./build"

      - name: Force Fix System & Apply Themes
        run: |
          set -euo pipefail
          cd ./build
          
          # 1. MEMPERBAIKI STRUKTUR PARSER PBXPROJ YANG RUSAK SECARA OTOMATIS
          # Mencari file project.pbxproj
          PBX_FILE=$(find . -name "project.pbxproj" | head -1)
          if [ -n "$PBX_FILE" ]; then
            echo "Memperbaiki struktur internal pbxproj..."
            # Menghapus duplikasi baris atau karakter aneh jika ada akibat edit massal
            sed -i '' '/=======\|>>>>>>>\|<<<<<<</d' "$PBX_FILE"
          fi
          
          # 2. MENYUNTIKKAN TEMA WARNA BIRU NEON PADA DESIGN SYSTEM
          # Mengganti warna aksen merah menjadi Biru Neon Terang (0.0, 0.9, 1.0)
          find . -type f -name "DesignSystem.swift" -exec sed -i '' 's/red: 0.58, green: 0.015, blue: 0.025/red: 0.0, green: 0.9, blue: 1.0/g' {} +
          # Mengganti warna background pudar menjadi Hitam Kebiruan Gelap (0.01, 0.02, 0.04)
          find . -type f -name "DesignSystem.swift" -exec sed -i '' 's/red: 0.035, green: 0.008, blue: 0.010/red: 0.01, green: 0.02, blue: 0.04/g' {} +
          
          # 3. MEMASTIKAN FOLDER SKEMA MEMAKAI NAMA ZAYNX
          # Mencari folder xcschemes
          SCHEME_DIR=$(find . -name "xcschemes" -type d | head -1)
          if [ -n "$SCHEME_DIR" ]; then
            cd "$SCHEME_DIR"
            # Jika masih ada file skema nama lain, paksa ubah menjadi ZAYNX.xcscheme
            OLD_SCHEME=$(find . -name "*.xcscheme" | head -1)
            if [ -n "$OLD_SCHEME" ] && [ "$OLD_SCHEME" != "./ZAYNX.xcscheme" ]; then
              mv "$OLD_SCHEME" "ZAYNX.xcscheme"
            fi
            cd -
          fi

      - name: Force Build ZAYNX Application
        run: |
          set -euo pipefail
          cd ./build
          
          PROJECT=$(find . -name '*.xcodeproj' -type d | head -1 || true)
          
          # Memaksa build menggunakan skema ZAYNX pilihan Anda tanpa memedulikan eror deteksi otomatis
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "ZAYNX" \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "./App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            PRODUCT_BUNDLE_IDENTIFIER="com.zaynix.injecta"

      - name: Package IPA File
        run: |
          set -euo pipefail
          cd ./build
          APP_PATH=$(find "./App.xcarchive/Products/Applications" -maxdepth 1 -name '*.app' -type d | head -1)
          mkdir -p "./Payload"
          cp -R "$APP_PATH" "./Payload/"
          ditto -c -k --sequesterRsrc --keepParent "./Payload" "../Zaynix_Injecta_unsigned.ipa"

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zaynix-Injecta-unsigned-ipa
          path: ./Zaynix_Injecta_unsigned.ipa
          retention-days: 1
          
