name: Build Zaynix Injecta IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Actions Checkout
        uses: actions/checkout@v4

      - name: Extract Project File
        run: |
          set -euo pipefail
          ZIP_FILE=$(find . -maxdepth 1 -name '*.zip' | head -1)
          if [ -z "$ZIP_FILE" ]; then
            echo "Error: File ZIP tidak ditemukan!" >&2
            exit 1
          fi
          mkdir -p "./build_mentah"
          ditto -x -k "$ZIP_FILE" "./build_mentah"

      - name: Rebrand App Information safely
        run: |
          set -euo pipefail
          cd ./build_mentah
          
          # 1. Mengubah teks informasi tampilan menu luar secara aman langsung di memori server
          find . -type f \( -name "FFExternal" -o -name "*.strings" -o -name "*.plist" \) -exec sed -i '' 's/FFEX-/ZYNX-/g' {} + 2>/dev/null || true
          
          # 2. Memastikan seluruh folder Payload terstruktur dengan standar huruf P Kapital
          mkdir -p "../Payload"
          KONTEN_PAYLOAD=$(find . -type d -name "Payload" | head -1 || true)
          FOLDER_APP=$(find . -type d -name "*.app" | head -1 || true)
          
          if [ -n "$KONTEN_PAYLOAD" ]; then
            cp -R "$KONTEN_PAYLOAD/" "../Payload/"
          elif [ -n "$FOLDER_APP" ]; then
            cp -R "$FOLDER_APP" "../Payload/"
          else
            mkdir -p "../Payload/FFExternal.app"
            cp -R * ../Payload/FFExternal.app/ 2>/dev/null || true
          fi

      - name: Inject Valid Info.plist Structure
        run: |
          set -euo pipefail
          
          # Mengambil jalur folder .app yang sebenarnya di dalam struktur Payload
          APP_TARGET=$(find ./Payload -maxdepth 1 -name "*.app" -type d | head -1)
          
          # Menyuntikkan identitas Info.plist resmi agar GBox/ESign sukses melakukan proses Tanda Tangan (Sign)
          plutil -replace CFBundleDisplayName -string "Zaynix Injecta" "$APP_TARGET/Info.plist" 2>/dev/null || true
          plutil -replace CFBundleName -string "Zaynix" "$APP_TARGET/Info.plist" 2>/dev/null || true
          plutil -replace CFBundleIdentifier -string "com.zaynix.injecta" "$APP_TARGET/Info.plist" 2>/dev/null || true
          plutil -replace CFBundleExecutable -string "FFExternal" "$APP_TARGET/Info.plist" 2>/dev/null || true
          plutil -replace CFBundlePackageType -string "APPL" "$APP_TARGET/Info.plist" 2>/dev/null || true
          plutil -replace MinimumOSVersion -string "14.0" "$APP_TARGET/Info.plist" 2>/dev/null || true

      - name: Package Official IPA File
        run: |
          # Membungkus kembali struktur aplikasi jadi ke format .ipa resmi
          zip -r "Zaynix_Injecta_rebranded.ipa" "./Payload"
          ls -lh Zaynix_Injecta_rebranded.ipa

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zaynix-Injecta-rebranded-ipa
          path: ./Zaynix_Injecta_rebranded.ipa
          retention-days: 1
          
