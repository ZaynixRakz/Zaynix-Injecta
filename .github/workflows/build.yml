name: Build Zaynix Injecta IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Actions Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode Environment
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Extract Project File
        run: |
          set -euo pipefail
          ZIP_FILE=$(find . -maxdepth 1 -name '*.zip' | head -1)
          if [ -z "$ZIP_FILE" ]; then
            echo "Error: File ZIP tidak ditemukan!" >&2
            exit 1
          fi
          mkdir -p "./build"
          ditto -x -k "$ZIP_FILE" "./build"

      - name: Auto Rebrand Internal System & Theme
        run: |
          set -euo pipefail
          cd ./build
          
          # 1. Mengubah nama tampilan menu utama aplikasi secara aman
          find . -type f \( -name "*.swift" -o -name "*.strings" \) -exec sed -i '' 's/YAGAMI EXTRENAL/Zaynix Injecta/g' {} +
          find . -type f \( -name "*.swift" -o -name "*.strings" \) -exec sed -i '' 's/YAGAMIXIOS/ZaynixIOS/g' {} +
          
          # 2. Menyuntikkan tema warna Biru Neon Terang pada DesignSystem
          find . -type f -name "DesignSystem.swift" -exec sed -i '' 's/red: 0.58, green: 0.015, blue: 0.025/red: 0.0, green: 0.9, blue: 1.0/g' {} +
          find . -type f -name "DesignSystem.swift" -exec sed -i '' 's/red: 0.035, green: 0.008, blue: 0.010/red: 0.01, green: 0.02, blue: 0.04/g' {} +

          # 3. Mengubah nama skema internal dari OGIOS menjadi ZAYNX (5 huruf seimbang)
          SCHEME_DIR=$(find . -name "xcschemes" -type d | head -1 || true)
          if [ -n "$SCHEME_DIR" ]; then
            cd "$SCHEME_DIR"
            if [ -f "OGIOS.xcscheme" ]; then
              sed -i '' 's/OGIOS/ZAYNX/g' OGIOS.xcscheme
              mv OGIOS.xcscheme ZAYNX.xcscheme
            fi
            cd -
          fi

          # 4. Mengubah nama produk internal pada file project.pbxproj tanpa merusak baris karakter
          PBX_FILE=$(find . -name "project.pbxproj" | head -1 || true)
          if [ -n "$PBX_FILE" ]; then
            sed -i '' 's/OGIOS/ZAYNX/g' "$PBX_FILE"
          fi

      - name: Build Application with Rebranded Scheme
        run: |
          set -euo pipefail
          cd ./build
          PROJECT=$(find . -name '*.xcodeproj' -type d | head -1 || true)
          
          # Melakukan kompilasi resmi menggunakan skema ZAYNX yang baru diganti
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "ZAYNX" \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "./App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            PRODUCT_BUNDLE_IDENTIFIER="com.zaynix.injecta"

      - name: Package IPA File
        run: |
          set -euo pipefail
          cd ./build
          APP_PATH=$(find "./App.xcarchive/Products/Applications" -maxdepth 1 -name '*.app' -type d | head -1)
          mkdir -p "./Payload"
          cp -R "$APP_PATH" "./Payload/"
          ditto -c -k --sequesterRsrc --keepParent "./Payload" "../Zaynix_Injecta_unsigned.ipa"

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zaynix-Injecta-unsigned-ipa
          path: ./Zaynix_Injecta_unsigned.ipa
          retention-days: 1
          
