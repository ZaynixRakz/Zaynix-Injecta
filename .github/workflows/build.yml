name: Build Unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    name: build
    runs-on: macos-latest

    steps:
      - name: Set up job
        run: echo "Setting up job..."

      - name: Run actions/checkout@v4
        uses: actions/checkout@v4

      - name: Run maxim-lobanov/setup-xcode@v1
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.0'

      - name: Give Execute Permissions to Scripts
        run: |
          chmod +x build_unsigned.sh || true
          chmod +x build_esign_ready_ipa.sh || true

      - name: Run ./build_unsigned.sh
        run: |
          if [ -f "build_unsigned.sh" ]; then
            ./build_unsigned.sh
          else
            echo "build_unsigned.sh tidak ditemukan langsung di root, mencoba mencarinya..."
            find . -name "build_unsigned.sh" -exec chmod +x {} \; -exec {} \;
          fi

      - name: Run ./build_esign_ready_ipa.sh
        run: |
          if [ -f "build_esign_ready_ipa.sh" ]; then
            ./build_esign_ready_ipa.sh build/Hyper-Regedit-Key-Enabled-unsigned.ipa || true
          else
            echo "build_esign_ready_ipa.sh tidak ditemukan di root."
          fi

      - name: Run actions/upload-artifact@v4
        uses: actions/upload-artifact@v4
        with:
          name: Hyper-Regedit-Key-Enabled-unsigned
          path: |
            build/*.ipa
            *.ipa
            
