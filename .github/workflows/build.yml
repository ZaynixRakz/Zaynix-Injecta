name: Build Zaynix Injecta IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Actions Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode Environment
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Extract Project File
        run: |
          set -euo pipefail
          ZIP_FILE=$(find . -maxdepth 1 -name '*.zip' | head -1)
          if [ -z "$ZIP_FILE" ]; then
            echo "Error: File ZIP tidak ditemukan!" >&2
            exit 1
          fi
          mkdir -p "./build"
          ditto -x -k "$ZIP_FILE" "./build"

      - name: Safe Auto Rebrand Tampilan & Warna
        run: |
          set -euo pipefail
          cd ./build
          
          # Mengubah nama teks tampilan pada file UI (.swift) dan file bahasa (.strings) secara aman di dalam folder
          find . -type f \( -name "*.swift" -o -name "*.strings" \) -exec sed -i '' 's/YAGAMI EXTRENAL/Zaynix Injecta/g' {} +
          find . -type f \( -name "*.swift" -o -name "*.strings" \) -exec sed -i '' 's/YAGAMIXIOS/ZaynixIOS/g' {} +
          
          # Menyuntikkan warna tema Biru Neon otomatis ke file DesignSystem
          find . -type f -name "DesignSystem.swift" -exec sed -i '' 's/red: 0.58, green: 0.015, blue: 0.025/red: 0.0, green: 0.9, blue: 1.0/g' {} +
          find . -type f -name "DesignSystem.swift" -exec sed -i '' 's/red: 0.035, green: 0.008, blue: 0.010/red: 0.01, green: 0.02, blue: 0.04/g' {} +

      - name: Build Official Application via Xcode
        run: |
          set -euo pipefail
          cd ./build
          
          # Otomatis mendeteksi file proyek meskipun berada di dalam folder berlapis
          PROJECT=$(find . -name '*.xcodeproj' -type d | head -1 || true)
          
          # Menjalankan kompilasi resmi menggunakan skema asli agar binary mesin Apple terproduksi matang
          xcodebuild archive -project "$PROJECT" -scheme "OGIOS" -sdk iphoneos -configuration Release -archivePath "../App.xcarchive" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' PRODUCT_BUNDLE_IDENTIFIER="com.zaynix.injecta"

      - name: Package Official IPA File
        run: |
          set -euo pipefail
          APP_PATH=$(find "./App.xcarchive/Products/Applications" -maxdepth 1 -name '*.app' -type d | head -1)
          mkdir -p "./Payload"
          cp -R "$APP_PATH" "./Payload/"
          zip -r "Zaynix_Injecta_unsigned.ipa" "./Payload"

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zaynix-Injecta-unsigned-ipa
          path: ./Zaynix_Injecta_unsigned.ipa
          retention-days: 1
          
