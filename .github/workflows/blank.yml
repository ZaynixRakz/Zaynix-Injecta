name: Build Zaynix IPA
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Unzip Project File
        run: unzip *.zip

      - name: Compile and Build IPA
        run: |
          xcodebuild archive \
            -project ThreeOneOSFive.xcodeproj \
            -scheme ZAYNIX \
            -configuration Release \
            -archivePath ./build/Zaynix.xcarchive
          
          mkdir -p ./build/Payload
          cp -r ./build/Zaynix.xcarchive/Products/Applications/*.app ./build/Payload/
          cd ./build && zip -r Zaynix.ipa Payload

      - name: Upload Finished IPA
        uses: actions/upload-artifact@v4
        with:
          name: Zaynix-App-IPA
          path: ./build/Zaynix.ipa
          
